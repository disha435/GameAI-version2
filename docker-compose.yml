services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gd
      POSTGRES_PASSWORD: gd
      POSTGRES_DB: gd_runtime
    ports:
      # Host port 5433, not 5432 — this machine already has an unrelated
      # Postgres container from another project bound to 5432.
      - '5433:5432'
    volumes:
      - gd-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gd -d gd_runtime']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  gd-postgres-data:
